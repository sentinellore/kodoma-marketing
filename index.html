<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kodoma</title>
  <meta name="description" content="Kodoma — coming soon." />
  <meta name="theme-color" content="#0a0a0a" />

  <!-- Open Graph -->
  <meta property="og:title" content="Kodoma" />
  <meta property="og:description" content="Coming soon." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://kodoma.app" />

  <style>
    :root {
      --bg: #0a0a0a;
      --text: #f5f5f5;
      --muted: #888888;
      --coral: #FF5733;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 2rem;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 1.5rem;
    }

    .wordmark {
      font-size: clamp(3rem, 12vw, 6rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .wordmark .accent {
      color: var(--coral);
    }

    .status {
      font-size: 1.125rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.875rem;
      padding-top: 2rem;
    }

    footer a {
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s ease, color 0.15s ease;
    }

    footer a:hover {
      color: var(--text);
      border-bottom-color: var(--coral);
    }
  </style>
</head>
<body>
  <main>
    <h1 class="wordmark">kod<span class="accent">oma</span></h1>
    <p class="status">Coming soon.</p>
  </main>

  <footer>
    <a href="mailto:swetharozario@gmail.com">swetharozario@gmail.com</a>
  </footer>
</body>
</html>
